[package]
name = "lance-graph"
version = "0.5.4"
edition = "2021"
license = "Apache-2.0"
authors = ["Lance Devs <dev@lancedb.com>"]
repository = "https://github.com/lancedb/lance-graph"
readme = "README.md"
description = "Graph query engine for Lance datasets with Cypher support"
keywords = ["lance", "graph", "cypher", "query", "datafusion"]
categories = ["database", "data-structures", "science"]

[dependencies]
arrow = { version = "58.4", features = ["prettyprint"] }
arrow-array = "58.4"
arrow-schema = "58.4"
async-trait = "0.1"
datafusion = { version = "54.1", default-features = false, features = [
    "nested_expressions",
    "regex_expressions",
    "unicode_expressions",
    "crypto_expressions",
    "encoding_expressions",
    "datetime_expressions",
    "string_expressions",
    "parquet",
] }
datafusion-common = "54.1"
datafusion-expr = "54.1"
datafusion-sql = "54.1"
datafusion-functions-aggregate = "54.1"
futures = "0.3"
lance-graph-catalog = { path = "../lance-graph-catalog", version = "0.5.4" }
lance = "13.0.0"
lance-linalg = "13.0.0"
lance-namespace = "13.0.0"
nom = "7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
# Delta has no crates.io release on DataFusion 54; pin the last compatible revision.
deltalake = { git = "https://github.com/delta-io/delta-rs", rev = "37ee982736b645b4d3f79a5d59e680add229a58c", features = ["datafusion", "s3", "azure", "gcs"], optional = true }
# Kernel 0.25 uses parse_column_name, which was removed in derive 1.2.
buoyant_kernel_derive = { version = "=1.1.0", optional = true }
url = { version = "2", optional = true }

[features]
default = ["unity-catalog", "delta"]
unity-catalog = ["lance-graph-catalog/unity-catalog"]
delta = ["dep:deltalake", "dep:buoyant_kernel_derive", "dep:url"]

[dev-dependencies]
futures = "0.3"
lance-arrow = "13.0.0"
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
